<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e7490">
  <meta name="description" content="טיימרים עם צליל למרפאת שיניים">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dental Helper">
  <title>Dental Helper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Dental Helper</h1>
    </header>

    <section class="card">
      <button id="repeatBtn" class="btn btn-repeat" type="button" aria-pressed="false">
        <span class="btn-title" id="repeatTitle">התחל צליל כל 3.2 שניות</span>
        <span class="btn-sub" id="repeatSub">לחיצה נוספת עוצרת</span>
      </button>
    </section>

    <section class="card">
      <button id="minuteBtn" class="btn btn-minute" type="button" aria-pressed="false">
        <span class="btn-title" id="minuteTitle">צליל אחרי דקה</span>
        <span class="btn-sub" id="minuteSub">צליל אחד בלבד</span>
      </button>
    </section>

    <p class="note" id="note">כדי שהצליל יישמע, השאירו את האפליקציה פתוחה והמסך דולק.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
